<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>静电场 · 三维机理</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111b;font:12px/1.6 -apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif;color:#d7e4ed}#canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}.hud{position:absolute;z-index:3;pointer-events:none;left:18px;right:18px;top:16px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.caption{max-width:65%;text-shadow:0 2px 10px #000}.caption strong{display:block;font-size:13px;font-weight:500;color:#dcedf5}.caption small{display:block;color:#94aeba;font-size:10px;margin-top:4px}.tools{pointer-events:auto;display:flex;gap:6px}button{font-family:inherit;font-size:11px;line-height:1.5;border:1px solid #395062;border-radius:5px;background:#0a1927ce;color:#c8e3ec;padding:7px 10px;cursor:pointer}button:hover{background:#234451}#legend{position:absolute;left:18px;right:18px;bottom:15px;pointer-events:none;display:flex;gap:15px;color:#a9bec9;font-size:10px;flex-wrap:wrap}.blue{color:#73cce7}.gold{color:#ffd180}.hint{margin-left:auto;color:#8198a7}.license{color:#6f8c9b;pointer-events:auto}.loading{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#08111b;gap:12px;color:#a8c7d7}progress{width:min(260px,70%);height:4px;accent-color:#74cbd6}#load-note{font-size:11px;text-align:center;max-width:80%}@media(max-width:520px){.hud{left:11px;right:11px;top:12px;gap:8px}.caption{max-width:59%}.caption strong{font-size:11px}.caption small{font-size:9px}.tools{gap:3px;flex-direction:column}button{font-size:10px;padding:5px 7px}#legend{left:11px;right:11px;bottom:10px;font-size:9px;gap:8px}.hint{flex-basis:100%;margin-left:0}}
#attention-cue{position:absolute;z-index:2;pointer-events:none;transform:translate(-50%,-125%);padding:6px 10px;max-width:240px;background:#07131fe8;color:#ade0e9;border:1px solid #4f8595;border-radius:6px;font-size:12px;white-space:nowrap}#attention-cue:after{content:"";position:absolute;left:50%;bottom:-9px;height:9px;border-left:1px solid #8ccbd6}#attention-cue[hidden]{display:none}@media(max-width:520px){#attention-cue{max-width:220px;font-size:10px;white-space:normal;text-align:center}}
</style>$GODOT_HEAD_INCLUDE</head><body>
<canvas id="canvas" tabindex="0"></canvas><div id="attention-cue" hidden></div><div class="hud"><div class="caption"><strong id="caption">正在准备三维装置</strong><small id="model-note">剖开外壳看内部 · 教学装置</small></div><div class="tools"><button id="reset">重置视角</button><button id="space" hidden>空间视角</button><button id="gap">近看间隙</button><button id="cutaway">看完整外壳</button><button id="pause">暂停动画</button></div></div><div id="legend"><span class="blue">蓝：电场方向示意</span><span class="gold">金：电荷迁移示意</span><span class="hint">拖动旋转 · 滚轮 / 双指缩放 · 非事故数值复原</span><a class="license" href="GODOT_LICENSE.txt" target="_blank" rel="noopener">Godot / MIT</a></div><div class="loading" id="loading"><span>准备可交互的三维装置</span><progress id="progress"></progress><span id="load-note">首次载入引擎后可在本地反复使用</span></div>
<script src="$GODOT_URL"></script><script>
const config=$GODOT_CONFIG; const engine=new Engine(config); const params=new URLSearchParams(location.search);const isField=params.get('case')==='field';let cutaway=true,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
const send=data=>window.godotReceive?.(JSON.stringify(data));
window.updateCaseHUD=data=>{document.querySelector('#caption').textContent=data.caption;document.querySelector('#model-note').textContent=data.caseId==='field'?'同一采样面：两电荷、P 与各处的电场':data.cutaway?'剖开外壳看内部 · 教学装置':'完整外壳 · 教学装置';document.querySelector('#cutaway').hidden=data.caseId==='field';document.querySelector('#gap').hidden=data.caseId==='field';document.querySelector('#space').hidden=data.caseId!=='field';if(data.caseId==='field')document.querySelector('#legend').innerHTML='<span class="blue">蓝：总电场</span><span class="gold">金：观察点 P</span><span class="hint">拖球改变位置 · 拖空白旋转 · 滚轮缩放</span><a class="license" href="GODOT_LICENSE.txt" target="_blank" rel="noopener">Godot / MIT</a>';};
window.updateCaseCue=data=>{const node=document.querySelector('#attention-cue');node.hidden=!data.visible;if(!data.visible)return;node.textContent=data.label;node.style.left=(Math.max(.22,Math.min(.78,data.x))*100)+'%';node.style.top=(Math.max(.24,Math.min(.9,data.y))*100)+'%';};
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',event=>{if(event.matches){paused=true;send({type:'pause-visuals',paused:true});document.querySelector('#pause').textContent='继续动画';}});
window.onEngineReady=()=>{document.querySelector('#loading').hidden=true;document.querySelector('#loading').style.display='none';document.querySelector('#canvas').focus();};
document.querySelector('#reset').onclick=()=>send({type:'view-reset'});document.querySelector('#space').onclick=()=>send({type:'view-space'});document.querySelector('#gap').onclick=()=>send({type:'view-gap'});document.querySelector('#cutaway').onclick=()=>{cutaway=!cutaway;send({type:'cutaway',enabled:cutaway});document.querySelector('#cutaway').textContent=cutaway?'看完整外壳':'剖开看内部';};document.querySelector('#pause').onclick=()=>{paused=!paused;send({type:'pause-visuals',paused});document.querySelector('#pause').textContent=paused?'继续动画':'暂停动画';};
if(isField)document.querySelector('#pause').hidden=true;document.querySelector('#pause').textContent=paused?'继续动画':'暂停动画';
const missing=Engine.getMissingFeatures({threads:false});if(missing.length){document.querySelector('#load-note').textContent='此浏览器未启用 WebGL 2：'+missing.join(', ');}else engine.startGame({onProgress:(current,total)=>{const bar=document.querySelector('#progress');if(total>0){bar.value=current;bar.max=total;}}}).catch(error=>{document.querySelector('#load-note').textContent='模型加载未完成：'+error.message;parent.postMessage({type:'case-load-error',message:error.message},location.origin);console.error(error);});
</script></body></html>
